<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>EduTrack — Academic Management</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- CSS is in the same folder as index.html -->
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- Toast notifications -->
  <div id="toast-root"></div>

  <!-- =========================
       LOGIN PAGE
  ========================== -->

  <section id="login-view" class="login-shell">

    <div class="login-brand">

      <div class="brand-mark">E</div>

      <div>
        <strong>EduTrack</strong>
        <span>Smart Academic Management</span>
      </div>

    </div>


    <div class="login-card">

      <div class="eyebrow">
        SECURE ACCESS
      </div>

      <h1>
        Welcome back
      </h1>

      <p class="muted">
        Sign in to your academic workspace.
      </p>


      <!-- Role selection -->

      <div class="role-switch">

        <button
          type="button"
          class="role-btn active"
          data-role="student">
          🎓 Student
        </button>

        <button
          type="button"
          class="role-btn"
          data-role="faculty">
          👨‍🏫 Faculty
        </button>

        <button
          type="button"
          class="role-btn"
          data-role="admin">
          🛡️ Admin
        </button>

      </div>


      <!-- Login form -->

      <form id="login-form">

        <label>
          Email

          <input
            id="email"
            type="email"
            required
            autocomplete="email"
            value="student@edutrack.local"
          >
        </label>


        <label>
          Password

          <div class="password-wrap">

            <input
              id="password"
              type="password"
              required
              autocomplete="current-password"
              value="student123"
            >

            <button
              type="button"
              id="show-password">
              Show
            </button>

          </div>

        </label>


        <button
          class="primary full"
          type="submit">

          Sign in

          <span>→</span>

        </button>

      </form>


      <div class="demo-note">
        Demo accounts are listed in README.md.
      </div>

    </div>

  </section>


  <!-- =========================
       APPLICATION
  ========================== -->

  <section
    id="app-view"
    class="app-shell hidden">

    <!-- Sidebar -->

    <aside class="sidebar">

      <div class="brand">

        <div class="brand-mark">
          E
        </div>

        <div>
          <strong>EduTrack</strong>
          <small>Academic OS</small>
        </div>

      </div>


      <!-- Current user -->

      <div class="user-mini">

        <div
          class="avatar"
          id="sidebar-avatar">
          KT
        </div>

        <div>

          <strong id="sidebar-name">
            User
          </strong>

          <span id="sidebar-role">
            Role
          </span>

        </div>

      </div>


      <!-- Navigation -->

      <nav id="nav"></nav>


      <!-- Logout -->

      <button
        class="logout"
        id="logout"
        type="button">

        ↪ Sign out

      </button>

    </aside>


    <!-- Main application -->

    <main class="main">

      <!-- Top navigation -->

      <header class="topbar">

        <button
          class="mobile-menu"
          id="mobile-menu"
          type="button">

          ☰

        </button>


        <div>

          <span
            class="muted"
            id="breadcrumb">
            Dashboard
          </span>

          <h2 id="page-title">
            Dashboard
          </h2>

        </div>


        <div class="top-actions">

          <button
            class="icon-btn"
            id="notif-btn"
            type="button">

            🔔

            <span
              id="notif-count"
              class="badge hidden">
              0
            </span>

          </button>


          <div
            class="avatar"
            id="top-avatar">
            KT
          </div>

        </div>

      </header>


      <!-- Dynamic page content -->

      <div
        id="page"
        class="page">
      </div>

    </main>

  </section>


  <!-- Modal container -->

  <div id="modal-root"></div>


  <!-- JavaScript is in the same folder as index.html -->

  <script src="app.js"></script>

</body>
</html>
